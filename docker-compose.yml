services:
  backend:
    build: ./backend
    container_name: tcc_backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORTA_BACKEND}
    networks:
      - tccnet

  frontend:
    build: ./frontend
    container_name: tcc_frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    networks:
      - tccnet
    depends_on:
      - backend

networks:
  tccnet:
    driver: bridge
